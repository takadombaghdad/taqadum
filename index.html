<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9622B">
<title>حزب تقدّم - مكتب العامرية</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-bar">
  <div class="app-bar-inner">
    <img src="icon.png" alt="شعار حزب تقدّم" class="logo-mark">
    <div class="brand-text">
      <span class="wordmark">حزب تقدّم</span>
      <span class="office">مكتب العامرية</span>
    </div>
  </div>
  <span class="tagline" id="tagline">أخبار وبيانات الحزب</span>
</header>

<main id="view" class="view"></main>

<nav class="tab-bar">
  <button class="tab active" data-tab="news" aria-label="الأخبار">
    <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16v3H4zM4 10h16v9H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    <span>الأخبار</span>
  </button>
  <button class="tab" data-tab="admin" aria-label="لوحة التحكم">
    <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>لوحة التحكم</span>
  </button>
</nav>

<script src="app.js"></script>
</body>
</html>
